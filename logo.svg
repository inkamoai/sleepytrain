<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2b4f"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a4a"/>
      <stop offset="1" stop-color="#e8682a"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f8cff"/>
      <stop offset="1" stop-color="#4a5fd6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- night sky tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#sky)"/>
  <g fill="#ffe9b8">
    <circle cx="70" cy="92" r="4"/><circle cx="118" cy="150" r="2.5"/><circle cx="452" cy="230" r="3"/>
    <circle cx="300" cy="58" r="2.5"/><circle cx="58" cy="262" r="2.5"/><circle cx="470" cy="330" r="2"/>
  </g>
  <!-- moon -->
  <circle cx="420" cy="104" r="70" fill="url(#glow)"/>
  <path d="M432 58a50 50 0 1 0 36 82a40 40 0 1 1 -36 -82z" fill="#ffd27a"/>

  <!-- rails -->
  <rect x="56" y="440" width="400" height="12" rx="6" fill="#2f4266"/>
  <g fill="#24324f">
    <rect x="86" y="452" width="40" height="14" rx="4"/><rect x="176" y="452" width="40" height="14" rx="4"/>
    <rect x="296" y="452" width="40" height="14" rx="4"/><rect x="386" y="452" width="40" height="14" rx="4"/>
  </g>

  <!-- wheels -->
  <g>
    <circle cx="160" cy="418" r="34" fill="#2a2f45"/><circle cx="160" cy="418" r="14" fill="#8d9bb8"/>
    <circle cx="352" cy="418" r="34" fill="#2a2f45"/><circle cx="352" cy="418" r="14" fill="#8d9bb8"/>
  </g>

  <!-- locomotive body, front view -->
  <path d="M112 236 q0 -40 40 -40 h208 q40 0 40 40 v150 q0 22 -22 22 h-244 q-22 0 -22 -22z" fill="url(#body)" stroke="#b9481a" stroke-width="6"/>
  <!-- cowcatcher grille under the bumper -->
  <path d="M196 404 h120 l-22 40 h-76 z" fill="#3a3f5c" stroke="#23263a" stroke-width="4"/>
  <g stroke="#6b7394" stroke-width="5" stroke-linecap="round">
    <path d="M226 410 l-6 28"/><path d="M256 410 v28"/><path d="M286 410 l6 28"/>
  </g>
  <!-- bumper -->
  <rect x="96" y="382" width="320" height="30" rx="15" fill="#c4502a" stroke="#9c3a17" stroke-width="5"/>
  <!-- yellow warning stripe and headlights -->
  <rect x="118" y="364" width="276" height="12" rx="6" fill="#ffd27a"/>
  <circle cx="134" cy="397" r="10" fill="#fff4cf" stroke="#9c3a17" stroke-width="3"/>
  <circle cx="378" cy="397" r="10" fill="#fff4cf" stroke="#9c3a17" stroke-width="3"/>

  <!-- face plate (windshield) -->
  <rect x="150" y="232" width="212" height="128" rx="44" fill="#ffe7bf" stroke="#b9481a" stroke-width="5"/>
  <!-- closed sleepy eyes -->
  <path d="M188 286 q22 22 44 0" fill="none" stroke="#2a2f45" stroke-width="9" stroke-linecap="round"/>
  <path d="M280 286 q22 22 44 0" fill="none" stroke="#2a2f45" stroke-width="9" stroke-linecap="round"/>
  <g stroke="#2a2f45" stroke-width="5" stroke-linecap="round">
    <path d="M192 290 l-8 8"/><path d="M228 290 l8 8"/><path d="M284 290 l-8 8"/><path d="M320 290 l8 8"/>
  </g>
  <!-- cheeks -->
  <ellipse cx="178" cy="322" rx="17" ry="10" fill="#ff8f8f" opacity=".7"/>
  <ellipse cx="334" cy="322" rx="17" ry="10" fill="#ff8f8f" opacity=".7"/>
  <!-- small open sleeping mouth -->
  <ellipse cx="256" cy="330" rx="13" ry="10" fill="#7a2e2e"/>

  <!-- nightcap: floppy, drooping to the right with a pompom -->
  <path d="M128 210 q20 -120 150 -126 q96 -4 152 92 q14 26 2 52 q-26 -40 -64 -56 q-30 -12 -42 6 z" fill="url(#cap)"/>
  <path d="M300 92 q40 4 70 28" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="10" stroke-linecap="round"/>
  <g fill="#ffe9b8">
    <path d="M214 132 l5 11 l12 1 l-9 8 l3 12 l-11 -6 l-10 6 l3 -12 l-9 -8 l12 -1z"/>
    <path d="M330 142 l4 8 l9 1 l-7 6 l2 9 l-8 -5 l-8 5 l2 -9 l-7 -6 l9 -1z"/>
  </g>
  <!-- cap brim -->
  <rect x="112" y="186" width="246" height="40" rx="20" fill="#f4f6ff" stroke="#c9d1f2" stroke-width="4"/>
  <!-- pompom -->
  <circle cx="436" cy="262" r="28" fill="#f4f6ff" stroke="#c9d1f2" stroke-width="4"/>

  <!-- Zzz -->
  <g fill="#ffffff" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-weight="900">
    <text x="58" y="206" font-size="46" opacity=".95">Z</text>
    <text x="88" y="160" font-size="34" opacity=".75">z</text>
    <text x="112" y="124" font-size="24" opacity=".55">z</text>
  </g>
</svg>
